
name: Build WiFi Gamepad APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APKs
        run: |
          unzip WiFiGamepad13_AndroidStudio_Project.zip -d src
          cd src/WiFiGamepad13
          gradle :controller:assembleDebug :receiver:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: WiFiGamepad13-APKs
          path: |
            src/WiFiGamepad13/controller/build/outputs/apk/debug/*.apk
            src/WiFiGamepad13/receiver/build/outputs/apk/debug/*.apk
            
